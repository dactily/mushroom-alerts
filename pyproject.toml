[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mushroom-alerts"
version = "0.1.0"
description = "Mushroom growth alerts around Valašské Meziříčí (ČHMÚ, HoubyMapa, Open-Meteo)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ihor Travkin", email = "ihor.travkin@gr8.tech" }]
dependencies = [
    "requests>=2.31",
    "Pillow>=10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mushroom-alerts = "mushroom_alerts.__main__:main"

[tool.setuptools]
packages = ["mushroom_alerts", "mushroom_alerts.mapping"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Syntax errors and undefined/misused names only -- the set that catches a broken
# commit rather than a style disagreement. Ruff's own default set reports 168
# findings against this tree today, so raising the bar deserves its own commit.
select = ["E9", "F63", "F7", "F82"]
